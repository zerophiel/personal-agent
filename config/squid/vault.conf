# Egress allowlist: vault zone. Default deny.
# vault -> Anthropic + Telegram; vault-tools -> Notion; ingest-gmail -> Google.
http_port 3128
acl allowed_domains dstdomain api.anthropic.com api.telegram.org api.notion.com gmail.googleapis.com oauth2.googleapis.com
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow allowed_domains
http_access deny all
access_log stdio:/dev/stdout
cache deny all
