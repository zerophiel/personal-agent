# vault profile config (SPIKE version: no model credentials, no real data)
plugins:
  enabled:
    - cardguard
unauthorized_dm_behavior: ignore
agent:
  max_turns: 40
  disabled_toolsets:
    - terminal
    - code_execution
    - browser
    - web
    - delegation
    - file
    - cronjob
    - memory
security:
  allow_lazy_installs: false
